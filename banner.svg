<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300"
     role="img" aria-labelledby="title description">
  <title id="title">Umar Al Mukhtar — Software Developer</title>
  <desc id="description">Final-year CSE student building web apps and open-source tools. A blue line drawing shows a developer at a laptop.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#07101f"/>
      <stop offset="1" stop-color="#0b1c36"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#2478ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2478ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#234065"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .halo { animation: pulse 2.4s ease-in-out 2; }
    .cursor { animation: blink 1s step-end 4; }
    @keyframes pulse { 50% { opacity: .45; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .halo, .cursor { animation: none; }
    }
  </style>

  <!-- Intro stays visible throughout the animation. -->
  <rect x=".5" y=".5" width="799" height="299" rx="22"
        fill="url(#background)" stroke="#254166"/>
  <path d="M42 68h34" stroke="#5aaaff" stroke-width="3" stroke-linecap="round"/>
  <text class="sans" x="40" y="125" fill="#f0f6ff" font-size="53"
        font-weight="750" letter-spacing="-1.9">Umar Al Mukhtar</text>
  <text class="mono" x="42" y="167" fill="#76baff" font-size="23">Software Developer</text>
  <text class="sans" x="42" y="208" fill="#b4c7e0" font-size="20">
    <tspan x="42">Final-year CSE student building</tspan>
    <tspan x="42" dy="27">web apps and open-source tools.</tspan>
  </text>

  <!-- Decorative terminal portrait, drawn entirely with SVG paths. -->
  <g aria-hidden="true" transform="translate(535 42)">
    <rect width="222" height="216" rx="15" fill="#09162a" stroke="#28466d"/>
    <path d="M0 32h222" stroke="#28466d"/>
    <circle cx="15" cy="16" r="2.5" fill="#70b8ff"/>
    <circle cx="25" cy="16" r="2.5" fill="#3e73ad"/>
    <circle cx="35" cy="16" r="2.5" fill="#28466d"/>
    <rect x="13" y="44" width="196" height="156" fill="url(#dots)"/>
    <ellipse class="halo" cx="111" cy="123" rx="100" ry="77" fill="url(#halo)"/>
    <g fill="none" stroke="#7fbdff" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M81 111V98l9-16 15-8h18l15 10 6 15v12
               M86 104l11-11 10 5 14-6 18 13
               M86 118v8l9 12 14 7h8l14-7 9-12v-8
               M99 140l-17 8-9 11m53-19 17 8 9 11"/>
      <path d="M85 107h22v10H90l-5-5zm34 0h22v5l-5 5h-17zm-12 4h12
               m-10 21h8"/>
      <path d="M69 157h87l-6 29H75z M62 186h101"/>
      <path d="m104 167-5 5 5 5" stroke="#b4dbff"/>
    </g>
    <path class="cursor" d="M111 177h10" stroke="#b4dbff" stroke-width="2"/>
    <path d="M25 60v-7h7m165 7v-7h-7M25 185v7h7m165-7v7h-7"
          fill="none" stroke="#4276b1"/>
  </g>
</svg>
